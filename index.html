<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MJ Internet - Admin Panel</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --accent: #f59e0b;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --success: #10b981;
      --error: #ef4444;
      --shadow-color: rgba(0, 0, 0, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      transition: background-color 0.25s, color 0.25s, border-color 0.25s;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      padding: 20px 15px;
    }

    .admin-container {
      max-width: 1100px;
      margin: 0 auto;
    }

    .admin-header {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 25px;
      margin-bottom: 25px;
      box-shadow: 0 15px 35px var(--shadow-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    .brand-logo {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #0284c7 0%, #8b5cf6 50%, #ec4899 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-sub {
      font-size: 12px;
      color: var(--accent);
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-top: 4px;
    }

    .stats-bar {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }

    .stat-card {
      background: rgba(2, 132, 199, 0.1);
      border: 1px solid var(--primary);
      padding: 10px 18px;
      border-radius: 12px;
      text-align: center;
    }

    .stat-number {
      font-size: 20px;
      font-weight: 800;
      color: var(--primary);
    }

    .stat-label {
      font-size: 11px;
      color: var(--text-sub);
      font-weight: 600;
      text-transform: uppercase;
    }

    .controls-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn-refresh {
      background: var(--primary);
      color: #ffffff;
      border: none;
      padding: 12px 20px;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
    }

    .btn-refresh:hover {
      background: var(--primary-hover);
    }

    .search-box {
      padding: 10px 15px;
      border-radius: 10px;
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      color: var(--text-main);
      font-size: 14px;
      outline: none;
      min-width: 220px;
    }

    .table-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      box-shadow: 0 15px 35px var(--shadow-color);
      overflow: hidden;
    }

    .table-responsive {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th {
      background-color: rgba(15, 23, 42, 0.6);
      color: var(--primary);
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      padding: 16px 18px;
      border-bottom: 1px solid var(--card-border);
      white-space: nowrap;
    }

    td {
      padding: 15px 18px;
      border-bottom: 1px solid var(--card-border);
      font-size: 13px;
      color: var(--text-main);
      white-space: nowrap;
    }

    tr:hover {
      background-color: rgba(255, 255, 255, 0.03);
    }

    .badge-status {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
      background: rgba(245, 158, 11, 0.15);
      color: var(--accent);
      border: 1px solid var(--accent);
    }

    .phone-highlight {
      color: var(--success);
      font-weight: 700;
      font-family: monospace;
      font-size: 14px;
    }

    .pkg-highlight {
      color: #38bdf8;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <div class="admin-container">
    
    <!-- HEADER -->
    <div class="admin-header">
      <div>
        <div class="brand-logo">MJ INTERNET</div>
        <div class="brand-sub">Admin Control Panel Dashboard</div>
      </div>
      <div class="stats-bar">
        <div class="stat-card">
          <div class="stat-number" id="totalOrdersCount">0</div>
          <div class="stat-label">Jumla ya Oda</div>
        </div>
      </div>
    </div>

    <!-- CONTROLS -->
    <div class="controls-row">
      <button class="btn-refresh" onclick="fetchOrders()">
        <span>🔄</span> <span>Anza Upya / Refresh</span>
      </button>
      <input type="text" id="searchOrders" class="search-box" placeholder="Tafuta namba au jina..." onkeyup="filterOrders()">
    </div>

    <!-- TABLE CARD -->
    <div class="table-card">
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Muda / Tarehe</th>
              <th>Jina la Mteja</th>
              <th>Email</th>
              <th>Kifurushi (Halotel)</th>
              <th>Namba ya Halotel</th>
              <th>Hali (Status)</th>
            </tr>
          </thead>
          <tbody id="ordersTableBody">
            <tr>
              <td colspan="7" style="text-align: center; padding: 30px; color: var(--text-sub);">
                Inapakia oda kutoka kwenye server... ⏳
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    var GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw6gzwTaExxfjhgqYaZT9iCZt-zRtBSoKpSOFkFrx6RYe_Hrf5by_QFCRNEm5TTr68P/exec";
    var cachedOrders = [];

    function fetchOrders() {
      var tbody = document.getElementById("ordersTableBody");
      tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; padding: 30px; color: var(--text-sub);">Inapakia oda mpya... ⏳</td></tr>';

      fetch(GOOGLE_SCRIPT_URL)
        .then(function(response) { return response.json(); })
        .then(function(data) {
          cachedOrders = data;
          renderOrdersTable(data);
        })
        .catch(function(err) {
          console.error("Error fetching orders:", err);
          tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; padding: 30px; color: var(--error);">Imefeli kupakia data kutoka server. Hakikisha mtandao upo sawa!</td></tr>';
        });
    }

    function renderOrdersTable(data) {
      var tbody = document.getElementById("ordersTableBody");
      tbody.innerHTML = "";

      if (!data || data.length <= 1) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; padding: 30px; color: var(--text-sub);">Hakuna oda zilizopatikana kwenye server.</td></tr>';
        document.getElementById("totalOrdersCount").innerText = "0";
        return;
      }

      var totalCount = data.length - 1;
      document.getElementById("totalOrdersCount").innerText = totalCount;

      for (var i = data.length - 1; i >= 1; i--) {
        var row = data[i];
        var tr = document.createElement("tr");

        tr.innerHTML = `
          <td><strong>#${i}</strong></td>
          <td style="color: var(--text-sub); font-size: 12px;">${row[0] || 'N/A'}</td>
          <td><strong>${row[1] || 'N/A'}</strong></td>
          <td>${row[2] || 'N/A'}</td>
          <td><span class="pkg-highlight">${row[3] || 'N/A'}</span></td>
          <td><span class="phone-highlight">${row[4] || 'N/A'}</span></td>
          <td><span class="badge-status">${row[5] || 'Inafanyiwa Kazi ⏳'}</span></td>
        `;
        tbody.appendChild(tr);
      }
    }

    function filterOrders() {
      var query = document.getElementById("searchOrders").value.toLowerCase();
      if (!cachedOrders || cachedOrders.length <= 1) return;

      var filtered = [cachedOrders[0]];
      for (var i = 1; i < cachedOrders.length; i++) {
        var row = cachedOrders[i];
        var rowString = (row[1] + " " + row[2] + " " + row[3] + " " + row[4]).toLowerCase();
        if (rowString.indexOf(query) !== -1) {
          filtered.push(row);
        }
      }
      renderOrdersTable(filtered);
    }

    window.onload = function() {
      fetchOrders();
    };
  </script>
</body>
</html>
